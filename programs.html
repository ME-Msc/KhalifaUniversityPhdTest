<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="哈利法大学研究生项目目录：专业标题、研究方向和官网链接。" />
    <title>KU Programs | 哈利法大学专业目录</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <div id="accessGate" class="access-gate" hidden>
      <section class="gate-panel" aria-labelledby="gateTitle">
        <img
          class="ku-logo"
          src="https://www.ku.ac.ae/wp-content/uploads/2021/08/cropped-logo.png"
          alt="Khalifa University"
        />
        <h1 id="gateTitle">KU Compass</h1>
        <p>输入验证码查看哈利法大学专业目录。</p>
        <form id="accessForm" class="gate-form">
          <label for="accessCode">验证码</label>
          <div class="gate-row">
            <input
              id="accessCode"
              name="accessCode"
              autocomplete="one-time-code"
              autocapitalize="characters"
              spellcheck="false"
              required
            />
            <button type="submit">进入</button>
          </div>
          <p id="accessMessage" class="form-message" role="status"></p>
        </form>
      </section>
    </div>

    <main id="programApp" class="app-shell" hidden>
      <header class="topbar">
        <div class="brand-lockup">
          <img
            class="ku-logo"
            src="https://www.ku.ac.ae/wp-content/uploads/2021/08/cropped-logo.png"
            alt="Khalifa University"
          />
          <span class="eyebrow">Khalifa University Programs</span>
          <h1>专业目录</h1>
        </div>
        <a class="ghost-button top-link" href="index.html">返回测评</a>
      </header>

      <section class="result-panel program-catalog">
        <div class="section-heading">
          <span>Programs</span>
          <h2>全部专业</h2>
        </div>
        <div id="programCatalog" class="program-list"></div>
      </section>
    </main>

    <script type="module" src="assets/programs.js"></script>
  </body>
</html>
